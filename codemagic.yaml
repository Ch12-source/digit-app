workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project
        script: flutter create . --platforms=ios --project-name=digit_app --org=com.shuffledfusion
      - name: Restore custom AppDelegate
        script: cp -f ios/Runner/AppDelegate.custom.swift ios/Runner/AppDelegate.swift
      - name: Add LibTorch to Podfile
        script: |
          cd ios
          # Insert LibTorch before the flutter_install line
          sed -i '' 's/flutter_install_all_ios_pods/pod "LibTorch-Lite", "~>2.3.0"\n  flutter_install_all_ios_pods/' Podfile
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Install Flutter deps
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
