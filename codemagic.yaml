workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project
        script: flutter create . --platforms=ios --project-name=digit_app --org=com.shuffledfusion
      - name: Restore custom code
        script: |
          cp -f ios/Runner/AppDelegate.custom.swift ios/Runner/AppDelegate.swift
          cp -f ios/Podfile ios/Podfile 2>/dev/null || true
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Install Flutter deps
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
