workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project files
        script: |
          flutter create . --platforms=ios --project-name=digit_app --org=com.shuffledfusion
      - name: Restore custom iOS code
        script: |
          cp -f ios/Runner/AppDelegate.custom.swift ios/Runner/AppDelegate.swift
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
